version = getSubprojectVersion(project)

loom {
	accessWidenerPath = file('src/client/resources/fabric-client-gametest-api-v1.classtweaker')
}

testDependencies(project, [
	':fabric-screen-api-v1',
])

sourceSets {
	main {
		java {
			srcDir 'src/mixinConfig/java'
		}
	}
}

neoForge {
	runs {
		clientGametest {
			client()
			systemProperty 'fabric.client.gametest', 'true'
		}
	}
}

neoForge.mods {
	screenTestMod {
		sourceSet project(':fabric-screen-api-v1').sourceSets.testmod
	}
}
